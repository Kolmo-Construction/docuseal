name: Build Kolmo-patched DocuSeal image

on:
  push:
    branches: [kolmo-patches]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Single platform to keep the build under Railway image pull time.
          platforms: linux/amd64
          tags: |
            ghcr.io/kolmo-construction/docuseal:kolmo
            ghcr.io/kolmo-construction/docuseal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
